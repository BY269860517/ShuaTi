<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>错题本</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="phone">
    <section class="screen">
      <div class="status"><span>13:40</span><span>5G 100%</span></div>
      <div class="nav">错题本</div>
      <div class="content">
        <section style="padding:6px 0;">
          <h2 class="section-title" style="margin:0;">错题</h2>
          <p class="small-text">当前 8 题</p>
          <div class="rule">答错会自动加入错题本；连续答对 3 次视为已掌握并移出当前列表，再次答错会重新加入。</div>
        </section>

        <section class="list">
          <article class="block">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
              <span class="chip" style="height:24px;line-height:24px;min-width:54px;">单选</span>
              <span class="small-text">上次答错 2026-05-01</span>
            </div>
            <p class="question" style="margin-top:8px;">在刷题小程序中，用户上传 PDF 后系统最先需要完成的动作是什么？</p>
            <p class="small-text">错 1 次 · 连续正确 0 次</p>
            <span class="btn" style="width:100%;height:36px;margin-top:8px;">标记已掌握</span>
          </article>

          <article class="block">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
              <span class="chip" style="height:24px;line-height:24px;min-width:54px;">多选</span>
              <span class="small-text">上次答错 2026-05-01</span>
            </div>
            <p class="question" style="margin-top:8px;">以下哪些题型是当前 PDF 解析流程覆盖的？</p>
            <p class="small-text">错 2 次 · 连续正确 1 次</p>
            <span class="btn" style="width:100%;height:36px;margin-top:8px;">标记已掌握</span>
          </article>
        </section>

        <div class="bottom-fixed">
          <div class="btn btn-primary" style="width:100%;height:42px;">练习错题</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
