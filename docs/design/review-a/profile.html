<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="phone">
    <section class="screen">
      <div class="status"><span>13:40</span><span>5G 100%</span></div>
      <div class="nav">我的</div>
      <div class="content">
        <section style="padding:6px 0;">
          <h2 class="section-title" style="margin:0;">我的资料</h2>
          <p class="small-text">uid_2026_demo</p>
        </section>

        <article class="block">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div>
              <p class="small-text">资料</p>
              <div style="font-size:46px;font-weight:700;line-height:1.1;">2</div>
            </div>
            <div>
              <p class="small-text">当前错题</p>
              <div style="font-size:46px;font-weight:700;line-height:1.1;">8</div>
            </div>
          </div>
        </article>

        <div class="list">
          <span class="btn" style="width:100%;height:40px;">返回资料</span>
          <span class="btn btn-primary" style="width:100%;height:40px;">查看错题</span>
        </div>
      </div>
    </section>
  </main>

</html>
