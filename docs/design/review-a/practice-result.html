<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>练习结果</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="phone">
    <section class="screen">
      <div class="status"><span>13:40</span><span>5G 100%</span></div>
      <div class="nav">练习结果</div>
      <div class="content">
        <article class="block">
          <p class="small-text">本次正确</p>
          <div style="display:flex;align-items:baseline;gap:6px;margin-top:8px;">
            <strong style="font-size:62px;line-height:1;">16</strong>
            <span style="color:var(--text-muted);font-size:28px;">/ 20</span>
          </div>
        </article>

        <div class="ad-slot">广告位（结果页 feed 广告）</div>

        <div class="list">
          <span class="btn btn-primary" style="width:100%;height:40px;">重练同一材料</span>
          <span class="btn" style="width:100%;height:40px;">查看错题</span>
          <span class="btn" style="width:100%;height:40px;">回首页</span>
        </div>
      </div>
    </section>
  </main>

</html>
