<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>练习设置</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="phone">
    <section class="screen">
      <div class="status"><span>13:40</span><span>5G 100%</span></div>
      <div class="nav">开始练习</div>
      <div class="content">
        <article class="block">
          <p class="small-text">可练习题目</p>
          <div style="font-size:52px;font-weight:700;line-height:1.1;">36</div>
          <p class="small-text">全部题目，顺序出题，系统会按当前设置创建练习。</p>
        </article>

        <article class="block">
          <h2 class="section-title">题量</h2>
          <div class="chip-row">
            <span class="chip">5</span>
            <span class="chip">10</span>
            <span class="chip chip-active">20</span>
            <span class="chip">全部练习</span>
            <span class="chip">自定义</span>
          </div>
          <input class="input" value="15" style="margin-top:10px;" />
        </article>

        <article class="block">
          <h2 class="section-title">出题方式</h2>
          <div class="chip-row">
            <span class="chip chip-active">顺序</span>
            <span class="chip">随机</span>
          </div>
        </article>

        <article class="block">
          <h2 class="section-title">练习范围</h2>
          <div class="chip-row">
            <span class="chip chip-active">全部题目</span>
            <span class="chip">未练习题目</span>
          </div>
        </article>

        <article class="block">
          <h2 class="section-title">题型</h2>
          <div class="chip-row">
            <span class="chip chip-active">全部</span>
            <span class="chip">单选</span>
            <span class="chip">多选</span>
            <span class="chip">判断</span>
          </div>
        </article>

        <div class="bottom-fixed">
          <div class="btn btn-primary" style="width:100%;height:42px;">开始练习</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
