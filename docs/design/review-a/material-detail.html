<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>资料详情</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="phone">
    <section class="screen">
      <div class="status"><span>13:40</span><span>5G 100%</span></div>
      <div class="nav">资料详情</div>
      <div class="content">
        <article class="block">
          <div style="display:flex;justify-content:space-between;gap:10px;">
            <strong style="font-size:15px;line-height:1.4;">shuati-20mb-mixed-question-sample.pdf</strong>
            <span class="badge badge-success">可刷题</span>
          </div>
          <div class="meta">20 MB · 2026-05-01</div>
        </article>

        <article class="block">
          <div class="stats">
            <div><strong>36</strong><span>可导入</span></div>
            <div><strong>0</strong><span>需确认</span></div>
            <div><strong>0</strong><span>不可导入</span></div>
            <div><strong>36</strong><span>题目总数</span></div>
          </div>
        </article>

        <article class="block" style="border-color:var(--warning-border);background:var(--warning-soft);">
          <p class="small-text" style="color:var(--warning);">状态示例：正在解析 PDF，页面将自动刷新。</p>
        </article>

        <article class="block" style="border-color:var(--danger-border);background:var(--danger-soft);">
          <p class="small-text" style="color:var(--danger);">状态示例：解析失败，请检查 PDF 内容规范后重试。</p>
        </article>

        <div class="list">
          <span class="btn btn-primary" style="width:100%;height:40px;">审核候选题</span>
          <span class="btn" style="width:100%;height:40px;">练习设置</span>
          <span class="btn" style="width:100%;height:40px;">练习本资料错题</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
