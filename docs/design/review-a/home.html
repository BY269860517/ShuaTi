<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页 - 我的资料</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="phone">
    <section class="screen">
      <div class="status"><span>13:40</span><span>5G 100%</span></div>
      <div class="nav">我的资料</div>
      <div class="content">
        <div class="toolbar">
          <div class="toolbar-left">
            <h2 class="section-title" style="margin:0;">我的资料</h2>
            <p class="small-text">上传 PDF 后审核解析出的候选题，再进入练习。</p>
          </div>
          <div class="toolbar-right">
            <span class="btn">我的</span>
            <span class="btn btn-primary">上传 PDF</span>
          </div>
        </div>

        <article class="block">
          <div class="card-head">
            <strong style="font-size:15px;line-height:1.4;">shuati-20mb-mixed-question-sample.pdf</strong>
            <div class="card-actions">
              <span class="badge badge-success">可刷题</span>
              <span class="btn btn-danger btn-compact">删除</span>
            </div>
          </div>
          <div class="stats">
            <div><strong>36</strong><span>题目</span></div>
            <div><strong>0</strong><span>可导入</span></div>
            <div><strong>0</strong><span>待确认</span></div>
            <div><strong>0</strong><span>不可用</span></div>
          </div>
          <div class="progress-head"><span>已刷 12/36 题</span><span>33%</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:33%"></div></div>
          <div class="meta">20 MB · 2026-05-01</div>
        </article>

        <article class="block">
          <div class="card-head">
            <strong style="font-size:15px;line-height:1.4;">shuati-test-sample.pdf</strong>
            <div class="card-actions">
              <span class="badge badge-warning">解析中</span>
              <span class="btn btn-danger btn-compact">删除</span>
            </div>
          </div>
          <div class="stats">
            <div><strong>5</strong><span>题目</span></div>
            <div><strong>0</strong><span>可导入</span></div>
            <div><strong>0</strong><span>待确认</span></div>
            <div><strong>0</strong><span>不可用</span></div>
          </div>
          <div class="progress-head"><span>已刷 0/5 题</span><span>0%</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:0%"></div></div>
          <div class="meta">165.6 KB · 2026-04-30</div>
        </article>

        <div class="ad-slot">广告位（首页 feed 广告）</div>
      </div>
    </section>
  </main>
</body>
</html>
