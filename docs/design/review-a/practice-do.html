<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>答题中</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="phone">
    <section class="screen">
      <div class="status"><span>13:40</span><span>5G 100%</span></div>
      <div class="nav">答题</div>
      <div class="content">
        <article class="block">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="color:var(--brand-primary);font-weight:600;">进度 2 / 20</span>
            <span class="small-text">单选</span>
          </div>
          <p class="question" style="margin-top:12px;">在刷题小程序中，用户上传 PDF 后，系统最先需要完成的动作是什么？</p>
          <div class="list" style="margin-top:10px;">
            <div class="block" style="padding:10px;">A. 直接开始错题练习</div>
            <div class="block" style="padding:10px;border-color:var(--brand-border-strong);background:var(--brand-primary-soft);">B. 解析 PDF 并生成候选题</div>
            <div class="block" style="padding:10px;">C. 删除用户资料</div>
            <div class="block" style="padding:10px;">D. 立即展示结果</div>
          </div>
        </article>

        <article class="block" style="border-color:var(--brand-success-border);background:var(--brand-success-soft);">
          <h2 class="section-title" style="color:var(--brand-success);margin-bottom:6px;">回答正确</h2>
          <p class="small-text" style="color:var(--text-body);">正确答案：B</p>
          <p class="small-text" style="color:var(--text-body);">解析：上传 PDF 后，需要先完成解析并生成候选题。</p>
        </article>

        <div class="bottom-fixed">
          <div class="btn btn-primary" style="width:100%;height:42px;">下一题</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
